<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Kubernetes cluster architecture</title>
  <desc id="diagramDesc">The control plane contains etcd, the API server, the scheduler, the controller manager and an optional cloud controller manager. Every component connects to the API server, and only the API server reads and writes etcd. Each worker node runs a kubelet, a container runtime reached over the CRI, and an optional kube-proxy. The kubelet and kube-proxy connect back to the API server.</desc>

  <style>
    /* Boxes carry their own fills with dark text, so they stay legible on any
       page background. Only the elements drawn straight onto the page need to
       adapt, and those use a mid tone that works in both themes, refined by
       the prefers-color-scheme block below. */
    .panel      { fill: #8b96a608; stroke: #8b96a6; stroke-width: 1.4; }
    .panel-label{ fill: #6b7686; font-size: 16px; font-weight: 600; }
    .edge       { stroke: #7d8899; stroke-width: 1.8; fill: none; }
    .edge-head  { fill: #7d8899; }
    .edge-label { fill: #6b7686; font-size: 12px; }
    .box-label  { fill: #14202e; font-size: 15.5px; font-weight: 600; }
    .box-opt    { fill: #14202e; font-size: 11.5px; opacity: 0.7; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #8b96a610; stroke: #7a8697; }
      .panel-label{ fill: #c2cbd8; }
      .edge       { stroke: #96a2b3; }
      .edge-head  { fill: #96a2b3; }
      .edge-label { fill: #9aa5b5; }
    }
  </style>

  <defs>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="edge-head"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

    <!-- ========== panels ========== -->
    <!-- stacked outlines suggest more than one worker node -->
    <rect class="panel" x="486" y="24" width="232" height="380" rx="10"/>
    <rect class="panel" x="478" y="32" width="232" height="380" rx="10"/>
    <rect class="panel" x="470" y="40" width="232" height="380" rx="10"/>
    <rect class="panel" x="16"  y="40" width="420" height="380" rx="10"/>

    <text class="panel-label" x="34"  y="70">Control plane</text>
    <text class="panel-label" x="488" y="70">Worker node(s)</text>

    <!-- ========== edges (drawn before boxes so they tuck underneath) ========== -->

    <!-- API server <-> etcd -->
    <path class="edge" d="M 244 131 H 172" marker-end="url(#arrowEnd)" marker-start="url(#arrowEnd)"/>
    <text class="edge-label" x="208" y="121" text-anchor="middle">read / write</text>

    <!-- the three bottom-row components fan up into the API server.
         Curves rather than shared elbows, so no two segments overlap. -->
    <!-- scheduler -> API server -->
    <path class="edge" d="M 88 284 C 88 222, 232 214, 300 166" marker-end="url(#arrowEnd)"/>
    <!-- controller manager -> API server -->
    <path class="edge" d="M 220 284 C 220 234, 300 210, 330 166" marker-end="url(#arrowEnd)"/>
    <!-- cloud controller manager -> API server -->
    <path class="edge" d="M 360 284 C 360 236, 357 198, 356 166" marker-end="url(#arrowEnd)"/>

    <!-- kube-proxy -> API server -->
    <path class="edge" d="M 500 129 C 466 129, 452 122, 424 122" marker-end="url(#arrowEnd)"/>
    <!-- kubelet -> API server -->
    <path class="edge" d="M 500 229 C 458 229, 448 146, 424 144" marker-end="url(#arrowEnd)"/>

    <!-- kubelet -> container runtime -->
    <path class="edge" d="M 586 262 V 296" marker-end="url(#arrowEnd)"/>
    <text class="edge-label" x="596" y="284">CRI</text>

    <!-- ========== control plane boxes ========== -->

    <!-- etcd, drawn as a datastore cylinder -->
    <g>
      <path d="M 40 112 a 66 13 0 0 1 132 0 v 38 a 66 13 0 0 1 -132 0 z"
            fill="#e7edf3" stroke="#5b6b7d" stroke-width="1.4"/>
      <path d="M 40 112 a 66 13 0 0 0 132 0" fill="none" stroke="#5b6b7d" stroke-width="1.4"/>
      <text class="box-label" x="106" y="142" text-anchor="middle">etcd</text>
    </g>

    <rect x="244" y="100" width="174" height="62" rx="7" fill="#b9dff2" stroke="#3f7f9e" stroke-width="1.4"/>
    <text class="box-label" x="331" y="137" text-anchor="middle">API server</text>

    <rect x="28" y="284" width="120" height="66" rx="7" fill="#cee7c9" stroke="#5d8a55" stroke-width="1.4"/>
    <text class="box-label" x="88" y="323" text-anchor="middle">Scheduler</text>

    <rect x="156" y="284" width="128" height="66" rx="7" fill="#ccd2ee" stroke="#5a63a0" stroke-width="1.4"/>
    <text class="box-label" x="220" y="312" text-anchor="middle">Controller</text>
    <text class="box-label" x="220" y="332" text-anchor="middle">manager</text>

    <rect x="292" y="284" width="136" height="66" rx="7" fill="#e2d6f0" stroke="#7a63a0" stroke-width="1.4"
          stroke-dasharray="5 4"/>
    <text class="box-label" x="360" y="308" text-anchor="middle">Cloud controller</text>
    <text class="box-label" x="360" y="327" text-anchor="middle">manager</text>
    <text class="box-opt"   x="360" y="342" text-anchor="middle">optional</text>

    <!-- ========== worker node boxes ========== -->

    <rect x="500" y="100" width="172" height="58" rx="7" fill="#f9cb9c" stroke="#b5762c" stroke-width="1.4"
          stroke-dasharray="5 4"/>
    <text class="box-label" x="586" y="126" text-anchor="middle">kube-proxy</text>
    <text class="box-opt"   x="586" y="143" text-anchor="middle">optional</text>

    <rect x="500" y="200" width="172" height="58" rx="7" fill="#f2a35e" stroke="#a35f18" stroke-width="1.4"/>
    <text class="box-label" x="586" y="235" text-anchor="middle">kubelet</text>

    <rect x="500" y="296" width="172" height="66" rx="7" fill="#ec8b3c" stroke="#93500f" stroke-width="1.4"/>
    <text class="box-label" x="586" y="324" text-anchor="middle">Container</text>
    <text class="box-label" x="586" y="344" text-anchor="middle">runtime</text>

  </g>
</svg>
